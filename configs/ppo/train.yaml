# Canonical PPO training config: network architecture, hyperparameters,
# downstream execution mode, and reward config for a real training run
# (scripts/train_ppo.py).
#
# Any experiment that changes one or more parameters should use a
# separate copy of this file rather than editing it in place, so this
# remains a known-good reference to compare experiments against.

seed: 0

network:
  observation_dim: 14
  num_actions: 4
  # 14 -> 256 -> 64 -> 32 -> {4 logits | 1 value}, tanh activations,
  # shared hidden sizes for both policy and value networks. Policy and
  # value networks do NOT share parameters -- each gets its own full
  # stack of these hidden sizes (separate Actor and Critic).
  hidden_sizes: [256, 64, 32]
  activation: "tanh"

hyperparameters:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 4
  num_minibatches: 4

rollout:
  # PPO never outputs acceleration/steering directly, only the 4-way
  # BehaviorAction, executed through the common Frenet MPC downstream.
  downstream_mode: "frenet_mpc"

reward_config_path: "configs/reward.yaml"

tracking:
  wandb_project: "its-merge-ppo"
  wandb_mode: "online"  # override with WANDB_MODE env var (e.g. WANDB_MODE=offline)
