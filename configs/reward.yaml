# Final PPO reward.
#
# R_t = R_terminal,t + w_s*R_safety,t + w_p*R_progress,t + w_d*R_decision,t
#
# decision_cost.enabled=false: the legacy flat per-decision-step cost is
# NOT part of the total -- Decision (below) is a switching-only
# regularizer that replaces it. real_decision_step/auto_execution_step
# are kept (not deleted) only so the RewardDecisionCost dataclass has
# well-defined fields; src.rewards.merge_reward._decision_cost returns
# 0.0 unconditionally whenever enabled=false, regardless of these values.
#
# Safety uses TARGET-FRONT interaction ONLY. Target-rear and
# source-front TTC/Gap remain in the observation/FOLLOW-behavior/
# evaluation-metrics but are excluded from this reward's calibration.

reward_version: "v1"

terminal:
  success: 1.0
  failure_collision: -1.0
  failure_offroad: -1.0
  truncation_horizon: -0.5
  none: 0.0

decision_cost:
  enabled: false
  real_decision_step: -0.01
  auto_execution_step: 0.0

safety:
  weight: 0.02
  ttc_danger_s: 2.5
  ttc_safe_s: 9.0
  gap_sufficient_m: 20.0
  use_target_front: true
  use_target_rear: false
  use_source_front: false

progress:
  weight: 0.5
  use_gamma: false
  d_m_initial_epsilon_m: 0.5

decision:
  weight: 0.02
  switching_only: true
