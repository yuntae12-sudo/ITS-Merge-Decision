# PPO Reward V1 (outputs/reward_v1_spec/REWARD_V1_SPEC_FINAL.md).
#
# R_t = R_terminal,t + w_s*R_safety,t + w_p*R_progress,t + w_d*R_decision,t
#
# Terminal and decision_cost are UNCHANGED from Reward V0 (same values,
# same source-of-truth contract -- src/rewards/merge_reward.py never
# re-derives termination itself). Safety/Progress/Decision are new dense
# shaping components, calibrated against TRAIN Tier A+B (n=1097,
# MERGE_DECISION_DATASET_V2_FROZEN=YES, freeze commit ef2d55d).
#
# Final approved scope (outputs/reward_v1_spec/REWARD_V1_SPEC_FINAL.md
# Section 5, resolving REWARD_V1_PREIMPLEMENTATION_AUDIT.md's three open
# decisions): Safety uses TARGET-FRONT interaction ONLY. Target-rear and
# source-front TTC/Gap remain in the observation/FOLLOW-behavior/
# evaluation-metrics but are excluded from this reward's calibration.

reward_version: "v1"

terminal:
  success: 1.0
  failure_collision: -1.0
  failure_offroad: -1.0
  truncation_horizon: -0.5
  none: 0.0

decision_cost:
  real_decision_step: -0.01
  auto_execution_step: 0.0

safety:
  weight: 0.02
  ttc_danger_s: 2.5
  ttc_safe_s: 9.0
  gap_sufficient_m: 20.0
  use_target_front: true
  use_target_rear: false
  use_source_front: false

progress:
  weight: 0.5
  use_gamma: false
  d_m_initial_epsilon_m: 0.5

decision:
  weight: 0.02
  switching_only: true
