# PPO Reward V0 (docs/ppo/PPO_PLAN.md SS5 / SS0.1 P2).
#
# R = terminal_outcome + decision_cost. Terminal outcome is looked up
# from the frozen MergeEnvironment's own TerminationReason (never
# re-derived -- see src/rewards/merge_reward.py and PPO_PLAN.md SS5.1).
# decision_cost is applied on real PPO decision steps only (pre-step
# policy_mask == 1); 0.0 on auto-executed MERGE-commitment steps.
#
# These values are FIXED through P0-P5 (PPO_PLAN.md SS5: "Reward
# weights are not tuned in P0-P5"). Do not edit as part of any P0-P5
# task -- Reward V1 (a later, out-of-scope revision) is the only place
# new values may ever be introduced, and only after the user reviews
# W&B results themselves.

reward_version: "v0"

terminal:
  success: 1.0
  failure_collision: -1.0
  failure_offroad: -1.0
  truncation_horizon: -0.5
  none: 0.0

decision_cost:
  real_decision_step: -0.01
  auto_execution_step: 0.0
