# Canonical WOMD dataset loading configuration for the final PPO
# runtime (MergeEnvironment, train/smoke/visualize entrypoints, and
# their tests). Loaded through
# `src.scenarios.scenario_loader.load_dataset_config`, which supports
# both this multi-shard schema and the single-`path:` schema some
# dataset-construction tooling still uses.
#
# Authorized objects: training_tfexample.tfrecord-00000-of-01000
# through -00009-of-01000 only.
dataset_name: WOMD
split: training
shards:
  - data/womd/training/training_tfexample.tfrecord-00000-of-01000
  - data/womd/training/training_tfexample.tfrecord-00001-of-01000
  - data/womd/training/training_tfexample.tfrecord-00002-of-01000
  - data/womd/training/training_tfexample.tfrecord-00003-of-01000
  - data/womd/training/training_tfexample.tfrecord-00004-of-01000
  - data/womd/training/training_tfexample.tfrecord-00005-of-01000
  - data/womd/training/training_tfexample.tfrecord-00006-of-01000
  - data/womd/training/training_tfexample.tfrecord-00007-of-01000
  - data/womd/training/training_tfexample.tfrecord-00008-of-01000
  - data/womd/training/training_tfexample.tfrecord-00009-of-01000
max_num_objects: 64
repeat: 1
shuffle_seed: null
